name: lms

services:
  api:
    build: .
    image: lms-api
    container_name: lms-api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://lms:lms@postgres:5432/lms
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      STORAGE_PROVIDER: s3
      S3_ENDPOINT_URL: http://storage:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_ACCESS_KEY: lmsaccess
      S3_SECRET_KEY: lmssecret123
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - lms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for course images and videos.
  # API on :9000, web console at http://localhost:9001/rustfs/console/ (log in with the keys below).
  storage:
    image: rustfs/rustfs:latest
    container_name: lms-storage
    environment:
      RUSTFS_ACCESS_KEY: lmsaccess
      RUSTFS_SECRET_KEY: lmssecret123
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lms_storage_data:/data

volumes:
  lms_postgres_data:
  lms_storage_data:
